webui:
  ros__parameters:
    core_service: /core/query
    database_service: /database/query
    measurement_topic: /ltm2985/measurement
    measure_topic: /measure_device
    measure_command_topic: /measure_device/command
    bind_host: 0.0.0.0
    bind_port: 80
    title: Delatometry Control
    queue_enabled: false
    auth_enabled: false
    auth_user: admin
    auth_password: admin
    status_refresh_period_sec: 1.0
    control_loop_period_sec: 1.0
    measurement_log_e720_max_age_sec: 1.0
    measurement_bulk_size: 12
    measurement_bulk_flush_sec: 0.25
    ros_service_timeout_sec: 15.0
    database_list_timeout_sec: 30.0
    programs_cache_refresh_sec: 3.0
    core_service_timeout_sec: 3.0
    run_charts_dir: ''
    enable_measurement_logging: false
    measurement_log_control_channel: 9
    measurement_log_monitor_channel: 3
    ltm_raw_topic: /ltm2985/raw_json
    ads_topic: /ads1256
    stream_max_lines: 30
    ltm_control_channel: 9
    ltm_monitor_channel: 3
    delatometry_env_file: /etc/default/delatometry
    export_dir: ""
    enable_service_control: true
    network_use_sudo: true
    systemd_units:
      - delatometry-database.service
      - delatometry-ltm2985.service
      - delatometry-measure-device.service
      - delatometry-ads1256.service
      - delatometry-core.service
      - delatometry-hmi.service
      - delatometry-webui.service
      - mariadb.service
